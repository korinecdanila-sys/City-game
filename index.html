<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11191e">
<title>Год до рассвета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#11191e;--panel:#1b272e;--line:#33434c;--text:#e9eee9;--muted:#a1b1b6;--gold:#edbc77;--green:#92ceb1}
*{box-sizing:border-box}
body{margin:0;background:#0a1014;color:var(--text);font:15px/1.5 system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button{border:1px solid var(--line);border-radius:12px;background:#283842;color:var(--text);padding:12px 15px}
.primary{background:var(--gold);color:#242018;border-color:var(--gold);font-weight:750}
h1,h2,h3,p{margin:0 0 12px}h1,h2{font-family:Georgia,serif}h1{font-size:29px}h2{font-size:25px}h3{font-size:17px}
small,.muted{color:var(--muted)}small{font-size:12px}
#app{max-width:780px;margin:auto;min-height:100dvh;background:var(--bg)}
header{padding:18px 18px 12px;background:#111b21;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand strong{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}
.stat{padding:9px 3px;background:#1c2931;border-radius:10px;text-align:center;font-size:13px;font-weight:700}
.stat small{display:block;font-size:10px;font-weight:400;margin-top:3px}
main{padding:18px 18px calc(100px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:13px}
.adviser{border-color:#687559;background:linear-gradient(120deg,#29372e,#1a2930)}
.kicker{color:var(--gold);letter-spacing:2px;font-size:10px;text-transform:uppercase;margin-bottom:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}.row small{flex-basis:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{width:100%}
.badge{display:inline-block;font-size:11px;background:#30433d;color:var(--green);padding:3px 8px;border-radius:20px}
.price{color:var(--gold)}
.track{height:7px;background:#0b1419;border-radius:10px;margin:13px 0;overflow:hidden}.track span{display:block;height:100%;background:var(--green)}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:15px}
.choice strong,.choice small{display:block}.choice small{margin-top:5px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);background:#132129f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}
nav button{font-size:10px;border:0;background:none;padding:5px 1px;color:var(--muted)}
nav button.active{color:var(--gold)}nav span{display:block;font-size:20px}
.art{border-radius:17px;overflow:hidden;background:#384d4b;margin-bottom:15px;position:relative}
.art svg{display:block;width:100%;height:auto}
.art-caption{position:absolute;left:14px;top:12px;font-size:10px;letter-spacing:2px;color:#e6ece8}
.story{padding-top:12px}.story .card{padding:24px}
blockquote{margin:15px 0;padding:10px 15px;border-left:2px solid var(--gold);color:#d6dfd6}
input{width:100%;border:1px solid #61737a;background:#101c23;color:white;padding:14px;border-radius:10px;margin-bottom:12px}
#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);width:min(92%,560px);padding:13px 16px;border:1px solid #657c6b;background:#243b30;color:white;border-radius:12px;z-index:40;display:none}
dialog{max-width:500px;width:calc(100% - 30px);background:#1b2b34;color:var(--text);border:1px solid #617680;border-radius:18px;padding:24px}
dialog::backdrop{background:#000b}
.log{border-left:2px solid #4c6458;padding-left:12px;margin:12px 0;font-size:13px}
.locked{color:#b2aaa0}
@media(max-width:380px){main{padding:12px 12px 100px}.grid{grid-template-columns:1fr}.stats{gap:3px}.stat{font-size:11px}}
@media(prefers-reduced-motion:no-preference){.primary{transition:filter .2s}.primary:hover{filter:brightness(1.08)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<dialog id="dialog"><div id="dialogContent"></div><button id="closeDialog" class="full">Закрыть</button></dialog>
<script>
"use strict";

/*
Локальная одиночная версия.
Донаты и rewarded-реклама намеренно отключены до подключения сервера.
Настоящие платежи требуют Telegram Stars и проверки successful_payment
на сервере. Награда за рекламу должна выдаваться сервером после
подтверждения рекламной сети. Здесь нет имитации оплаты или просмотра.
Онлайн-рейтинг также требует сервера и проверки Telegram initData.
*/

const KEY="dawn.city.v4";
const app=document.getElementById("app");
const money=n=>"$"+Math.round(n).toLocaleString("ru-RU");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tab="city",noticeTimer;
const base=()=>({
 version:4,scene:0,name:"Новая Надежда",day:1,cash:200000,
 population:1,morale:50,inspected:false,
 jobs:{},arrival:"none",waited:false,homes:1,
 businesses:0,parks:0,clinic:false,turns:0,event:null,
 ending:null,logs:[{day:1,text:"Начало пари. Бюджет: $200 000."}]
});
let state=base(),storageOK=true;
try{
 const old=JSON.parse(localStorage.getItem(KEY)||"null");
 if(old&&old.version===4&&Number.isFinite(old.cash)&&
 Number.isInteger(old.scene)&&old.scene>=0&&old.scene<=5&&
 old.jobs&&typeof old.jobs==="object"&&Array.isArray(old.logs)){
   state={...base(),...old};
 }
}catch(e){storageOK=false}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}

const projects=[
 {id:"house",name:"Дом №1",icon:"▥",text:"Кровля протекает, лестницы завалены. В дом нельзя заселять людей до обследования и ремонта.",
 choices:[
 ["Укрепить и утеплить",34000,3,"Надёжная кровля и утепление. Содержание дешевле.",true],
 ["Безопасный базовый ремонт",22000,2,"Все аварийные места устранены, но без утепления. Содержание +$100 в день.",false]]},
 {id:"power",name:"Электроснабжение",icon:"ϟ",text:"Анатолий отряхивает пыль со схемы: «Без питания насос не включишь. Но переносной генератор может выручить».",
 choices:[
 ["Восстановить подстанцию",30000,3,"Резерв мощности для следующих домов.",true],
 ["Дизельный генератор",18000,1,"Быстрый запуск. Топливо +$180 в день; дальнейшие дома потребуют подстанцию.",false]]},
 {id:"water",name:"Вода",icon:"≈",text:"«Вода в скважине есть. Нужны насос, анализы и промывка труб». Безопасность воды обязательна при любом выборе.",
 choices:[
 ["Насос и новая автоматика",24000,2,"Надёжное оборудование с запасом мощности.",true],
 ["Ремонт старого насоса",14000,1,"Вода безопасна, но насос потребует ремонта за $4 000 после заселения.",false]]},
 {id:"sewer",name:"Канализация",icon:"↧",text:"Коллектор забит. Пока не восстановлен отвод стоков, заселять дом нельзя.",
 choices:[
 ["Восстановить коллектор",20000,2,"Подходит для расширения квартала.",true],
 ["Герметичная локальная система",12000,1,"Безопасно для первого дома. Вывоз стоков +$120 в день.",false]]},
 {id:"heat",name:"Отопление",icon:"♨",text:"«Всю котельную сразу не потянем. Один котёл и отдельный контур — этого хватит», — говорит Анатолий.",
 choices:[
 ["Котёл и изоляция труб",28000,3,"Меньше потерь тепла, есть резерв для расширения.",true],
 ["Малый временный контур",16000,1,"Тепло будет. Топливо +$150 в день; расширение потребует модернизации.",false]]},
 {id:"supply",name:"Питание и быт",icon:"◈",text:"Жителям понадобятся еда, вывоз мусора и безопасные общие помещения.",
 choices:[
 ["Кухня и договор поставок",14000,2,"Питание и вывоз мусора организованы. Довольство +8.",true],
 ["Базовое снабжение",8000,1,"Потребности закрыты. Расходы на доставку +$80 в день.",false]]}
];
const completed=()=>projects.every(p=>state.jobs[p.id]);
const upgraded=()=>projects.every(p=>state.jobs[p.id]?.quality);
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}
}
function log(text){state.logs.unshift({day:state.day,text});state.logs=state.logs.slice(0,80)}
function toast(text){
 const t=document.getElementById("toast");t.textContent=text;t.style.display="block";
 clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>t.style.display="none",4200);
}
function modal(title,text){
 document.getElementById("dialogContent").innerHTML="<h2>"+esc(title)+"</h2><p>"+esc(text)+"</p>";
 document.getElementById("dialog").showModal();
}
document.getElementById("closeDialog").onclick=()=>document.getElementById("dialog").close();
function expense(){
 let n=0;
 const rates={house:100,power:180,sewer:120,heat:150,supply:80};
 for(const [id,v] of Object.entries(rates))if(state.jobs[id]&&!state.jobs[id].quality)n+=v;
 return state.population>1?n+state.population*2:0;
}
function income(){return state.population>1?state.population*4+state.businesses*950:0}
function finishTurn(days,cost,description){
 state.cash-=cost;
 for(let i=0;i<days;i++){
   state.day++;
   state.cash+=income()-expense();
 }
 state.cash=Math.max(0,Math.round(state.cash));
 state.morale=Math.max(0,Math.min(100,state.morale));
 state.turns++;
 log(description);checkEnding();save();render();
}
function checkEnding(){
 if(state.population>=10000)state.ending="win";
 else if(state.day>365)state.ending="lose";
}
function canAct(cost){
 if(state.ending)return false;
 if(state.event){toast("Сначала примите решение по событию.");return false}
 if(state.cash<cost){toast("Не хватает "+money(cost-state.cash)+".");return false}
 return true;
}
function art(){
 const lit=state.arrival==="accepted";
 let buildings="";
 for(let r=0;r<3;r++)for(let c=0;c<4;c++){
   const x=45+c*130+r*10,y=72+r*90;
   let windows="";
   for(let j=0;j<4;j++)for(let k=0;k<3;k++)
     windows+=`<rect x="${x+7+j*17}" y="${y+8+k*12}" width="8" height="6" fill="${lit&&(r===0||c===0)?"#e5ba73":"#28383d"}"/>`;
   buildings+=`<g><path d="M${x+4} ${y+53}l89 17 20-18-88-16z" fill="#17282a" opacity=".5"/>
   <path d="M${x} ${y}l18-13h77l-18 13z" fill="#a0a49a"/>
   <path d="M${x+77} ${y}l18-13v51l-18 13z" fill="#44575a"/>
   <rect x="${x}" y="${y}" width="77" height="51" fill="${lit?"#899087":"#6c7b78"}"/>${windows}</g>`;
 }
 return `<div class="art"><span class="art-caption">${lit?"ПЕРВЫЕ ОКНА СНОВА ГОРЯТ":"ГОРОД МОЛЧАЛ ДВАДЦАТЬ ЛЕТ"}</span>
 <svg viewBox="0 0 600 370" role="img" aria-label="Панорама жилого квартала">
 <defs><linearGradient id="ground" x2="1" y2="1"><stop stop-color="#576e62"/><stop offset="1" stop-color="#2a4143"/></linearGradient></defs>
 <rect width="600" height="370" fill="url(#ground)"/>
 <path d="M0 160L600 160M0 255L600 255M160 30L190 370M420 25L450 370" stroke="#87928a" stroke-width="30"/>
 <path d="M0 160L600 160M0 255L600 255" stroke="#c0bca2" stroke-dasharray="14 14" opacity=".5"/>
 ${buildings}<g fill="#344f43"><circle cx="20" cy="300" r="22"/><circle cx="560" cy="205" r="24"/><circle cx="325" cy="40" r="21"/></g>
 </svg></div>`;
}
function story(){
 const scenes=[
 ["ПРЕДЛОЖЕНИЕ","Город в конверте",
 "Незнакомец кладёт на стол ключ и карту. На карте — город, покинутый двадцать лет назад.",
 "«Год. Десять тысяч жителей. Справитесь — город и десять миллионов долларов ваши. Нет — миллион долга и разрешение на снос».","Принять пари"],
 ["ПРИЕЗД","Здесь никто не живёт?",
 "За разбитой остановкой стоят сотни пустых окон. Пятиэтажки, девятиэтажки, заросший завод. Вечером город исчезает в темноте. И только на третьем этаже одного дома дрожит огонёк.",
 "Вы поднимаетесь по лестнице. Из-за двери слышно: «Если за металлом — уходи. Здесь и так всё вынесли».","Сказать: «Я приехал вернуть город»"],
 ["АНАТОЛИЙ, 78 ЛЕТ","Чай при свечах",
 "Старик долго смотрит на вас, потом отступает от двери. На плите остывает чайник. Рядом лежат выцветшие схемы котельной.",
 "«Анатолий. Главным на котельной был. Всех здесь знал… Ладно. Садись. Если всерьёз приехал, утром покажу, что осталось».","Спросить, почему он остался"],
 ["НОЧНОЙ РАЗГОВОР","У города должно быть имя",
 "«Жена здесь похоронена. Дом здесь. Куда мне?» Он замолкает, затем пододвигает старую карту. «Прошлое мы не переделаем. А новое имя можешь дать ты».",
 "Введите название города. Его можно будет изменить в настройках.","Назвать город"],
 ["УТРО","Не чинить всё сразу",
 "Анатолий ведёт вас к башне, подстанции и заводу. В котельной вода застыла в ржавых трубах. У коллектора провалился люк. В первом доме течёт крыша.",
 "«Двести тысяч — деньги хорошие, но город большой. Начнём с одного дома. Сделаем безопасно, дадим воду, свет, тепло и еду. Люди потом помогут».","Открыть план восстановления"]
 ];
 const s=scenes[state.scene];
 app.innerHTML=`<main class="story">${art()}<section class="card">
 <div class="kicker">Глава 1 · ${s[0]}</div><h1>${s[1]}</h1><p>${s[2]}</p><blockquote>${s[3]}</blockquote>
 ${state.scene===3?'<label for="cityInput">Название города</label><input id="cityInput" maxlength="30" placeholder="Новая Надежда" autocomplete="off">':""}
 <button class="primary full" data-action="next">${s[4]} →</button>
 <p style="margin-top:12px"><small>Одиночный прототип · прогресс хранится в этом браузере.</small></p>
 </section></main>`;
}
function recommendation(){
 if(!state.inspected)return ["Начните здесь","Нажмите «Осмотреть первый дом». Я покажу, что нужно восстановить.","inspect","Осмотреть первый дом →"];
 if(!completed())return ["Выберите работы ниже","Шесть карточек — шесть обязательных систем. Можно менять порядок. Перед подтверждением видны цена, сроки и последствия.","works","Перейти к работам ↓"];
 if(state.arrival==="none")return ["Первый дом готов","Вода, свет, тепло и быт работают. Теперь у Анатолия есть новость.","arrival","Поговорить с Анатолием →"];
 if(state.arrival==="pending")return ["Нужен ваш ответ","130 человек из общежития ждут решения. Транспорт и запас продуктов обойдутся в $6 000.","arrival","Решить вопрос с переселением →"];
 if(state.arrival==="declined")return ["Ищем других жителей","Объявления и помощь с переездом привлекут первую группу из 50 человек за $4 000.","alternative","Пригласить 50 жителей"];
 if(!upgraded())return ["Закрепите результат","Доведите временные системы до капитального уровня. Это снизит расходы и откроет расширение.","works","Показать улучшения ↓"];
 return ["Квартал готов к росту","Стройте рабочие места и восстанавливайте следующие дома. Новые жители приходят только при наличии жилья, работы и довольства от 40%.","develop","Открыть развитие →"];
}
function projectCards(){
 return projects.map(p=>{
   const j=state.jobs[p.id];
   return `<article class="card">
    <div class="row"><h3>${p.icon} ${p.name}</h3><span class="badge">${j?(j.quality?"Капитально":"Базовый уровень"):"Не работает"}</span></div>
    <p class="muted">${p.text}</p>
    ${!j?p.choices.map((c,i)=>`<button class="choice" data-action="build" data-id="${p.id}" data-option="${i}" ${state.cash<c[1]||state.event?"disabled":""}>
    <strong>${c[0]} · ${money(c[1])}</strong><small>${c[2]} дн. · ${c[3]}</small></button>`).join(""):
    !j.quality?`<button class="primary full" data-action="upgrade" data-id="${p.id}" ${state.cash<p.choices[0][1]-p.choices[1][1]+4000||state.event?"disabled":""}>Капитальное улучшение · ${money(p.choices[0][1]-p.choices[1][1]+4000)}</button><small>2 дня. Временное оборудование заменяется, повышенные расходы исчезают.</small>`:
    '<small>Система восстановлена. Дополнительных улучшений в этой главе нет.</small>'}
   </article>`;
 }).join("");
}
function cityView(){
 const r=recommendation(),count=Object.keys(state.jobs).length;
 return `<section class="card adviser"><div class="kicker">Анатолий · ваш следующий шаг</div>
 <h2>${r[0]}</h2><p>${r[1]}</p><button class="primary full" data-action="${r[2]}">${r[3]}</button></section>
 ${art()}<section class="card"><h3>Первый дом · ${count}/6 систем</h3>
 <div class="track"><span style="width:${count/6*100}%"></span></div>
 <p class="muted">Цель пари: 10 000 жителей до конца 365-го дня. Жильё: ${state.homes*200} мест. Работа: ${state.businesses*200} мест.</p>
 <p>Доход: ${money(income())}/день<br>Содержание: ${money(expense())}/день</p>
 <small>Время идёт только при выполнении действий. За время вне игры деньги не списываются.</small></section>`;
}
function developView(){
 if(state.arrival!=="accepted")return '<div class="card"><h2>Сначала — первый дом</h2><p>Восстановите все шесть систем и пригласите жителей.</p><button class="primary" data-action="works">К работам</button></div>';
 return `<section class="card adviser"><h2>Город просыпается</h2><p>У жителей есть навыки. Они помогают с работами, но материалы и техника всё равно стоят денег.</p>
 <small>Рабочие места: ${state.businesses*200}. Свободное жильё: ${state.homes*200-state.population}.</small></section>
 <div class="grid">
 <section class="card"><h3>Следующий дом</h3><p>+200 мест · 6 дней.<br>Нужны капитальные системы первого дома.</p><button class="primary full" data-action="expand" ${!upgraded()?"disabled":""}>${money(42000)}</button></section>
 <section class="card"><h3>Мастерские и магазин</h3><p>+200 рабочих мест.<br>+$950 в день · 3 дня.</p><button class="primary full" data-action="business">${money(12000)}</button></section>
 <section class="card"><h3>Сквер</h3><p>Довольство +12.<br>2 дня.</p><button class="primary full" data-action="park">${money(6500)}</button></section>
 <section class="card"><h3>Медпункт</h3><p>Довольство +15.<br>Снижает последствия болезни.</p><button class="primary full" data-action="clinic" ${state.clinic?"disabled":""}>${state.clinic?"Работает":money(16000)}</button></section>
 </div><section class="card"><h3>Приглашение новых жителей</h3>
 <p>До 200 человек за кампанию. Нужны свободное жильё, работа и довольство не ниже 40%.</p>
 <button class="primary full" data-action="campaign">Кампания · $3 000 · 2 дня</button></section>
 <button class="full" data-action="week">Прожить неделю · собрать доход</button>`;
}
function eventView(){
 const e=state.event;if(!e)return "";
 return `<section class="card adviser"><div class="kicker">Событие · требуется решение</div><h2>${e.title}</h2><p>${e.text}</p>
 ${e.options.map((o,i)=>`<button class="choice" data-action="event" data-option="${i}" ${state.cash<o.cost?"disabled":""}><strong>${o.name}</strong><small>${o.effect}</small></button>`).join("")}</section>`;
}
function settingsView(){

 if(["expand","business","park","clinic","campaign","week"].includes(action)){

   if(action==="campaign"){

     if(n<=0||state.morale<40){toast("Нужны свободное жильё, рабочие места и довольство от 40%.");return}
     state.population+=n;days=2;text="Приехали новые жители: "+n+".";
   }
   if(action==="week"){days=7;text="Прошла неделя. Собраны доходы и оплачено содержание."}

    container.prepend(figure);

  function refreshPortraits() {
    const storyCard = document.querySelector("#app .story .card");

    if (storyCard) {
      const title = storyCard.querySelector("h1")?.textContent.trim();

      if ([

      if (label.includes("Анатолий")) {

  function start() {

  } else {
    start();
  }
})();

<!--
Замените предыдущий блок сезонных изображений этим блоком.
Не оставляйте одновременно несколько сезонных скриптов.

Каждый сезон длится 7 РЕАЛЬНЫХ суток:
весна → лето → осень → зима → повторение.

Отсчёт начинается при первом запуске этой версии города.
Дата начала сохраняется вместе с игровым прогрессом.

Расходы котельной:
                   Зима    Весна/осень    Лето
Капитальная        $300       $150        $90
Временная          $450       $225        $135

Летом расходы ниже зимних на 70%, весной и осенью — на 50%.
Это расходы за игровой день: реальное время меняет сезон,
но деньги за время отсутствия игрока не списываются.

В этой версии игры топливо отдельно не учитывается:
расходы на котельную включены в денежное содержание города.
-->

<script>
(() => {
  "use strict";

  if (window.realWeekSeasonsInstalled) return;

  if (
    typeof state === "undefined" ||
    typeof save !== "function" ||
    typeof expense !== "function" ||
    typeof render !== "function"
  ) {
    console.error("Сезоны: разместите блок после основного скрипта игры.");
    return;
  }

  window.realWeekSeasonsInstalled = true;

  const WEEK = 7 * 24 * 60 * 60 * 1000;
  const BASE =
    "https://raw.githubusercontent.com/korinecdanila-sys/City-game/main/";

  const SEASONS = [
    {
      name: "Весна",
      file: "город.jpg",
      factor: 0.5,
      saving: 50
    },
    {
      name: "Лето",
      file: "город.jpg",
      factor: 0.3,
      saving: 70
    },
    {
      name: "Осень",
      file: "город.jpg",
      factor: 0.5,
      saving: 50
    },
    {
      name: "Зима",
      file: "зимний город.jpg",
      factor: 1,
      saving: 0
    }
  ];

  const originalExpense = expense;
  const originalRender = render;

  function ensureStart() {
    const now = Date.now();

    if (
      !Number.isFinite(state.seasonStartedAt) ||
      state.seasonStartedAt <= 0
    ) {
      state.seasonStartedAt = now;
      save();
    }

    return state.seasonStartedAt;
  }

  function seasonInfo() {
    const start = ensureStart();
    const elapsed = Math.max(0, Date.now() - start);
    const weeks = Math.floor(elapsed / WEEK);
    const index = weeks % SEASONS.length;

    return {
      ...SEASONS[index],
      index,
      nextName: SEASONS[(index + 1) % SEASONS.length].name,
      remaining: WEEK - (elapsed % WEEK)
    };
  }

  function boilerExpense(season = seasonInfo()) {
    const boiler = state.jobs && state.jobs.heat;

    // Без котельной или до заселения расходы не начисляются.
    if (!boiler || !(state.population > 1)) return 0;

    const winterCost = boiler.quality ? 300 : 450;

    return Math.round(winterCost * season.factor);
  }

  /*
  Основная игра уже включала $150 за временное отопление.
  Убираем этот старый расход, чтобы не посчитать его дважды,
  и добавляем полноценное сезонное содержание котельной.
  */
  expense = function seasonalExpense() {
    const oldTotal = originalExpense();
    const boiler = state.jobs && state.jobs.heat;

    const oldHeatingCost =
      state.population > 1 && boiler && !boiler.quality
        ? 150
        : 0;

    return Math.max(
      0,
      oldTotal - oldHeatingCost + boilerExpense()
    );
  };

  const style = document.createElement("style");
  style.textContent = `
    #app .art .real-season-image {
      display: block;
      width: 100%;
      height: auto;
      background: #172329;
    }

    #app .art .real-season-image[hidden],
    #app .art svg[hidden] {
      display: none !important;
    }

    #app .art .art-caption {
      z-index: 2;
      max-width: calc(100% - 28px);
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(10, 19, 25, .84);
      color: #f0f3ed;
      font-size: 11px;
      letter-spacing: .4px;
      pointer-events: none;
    }

    .real-season-panel {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #425760;
      border-radius: 12px;
      background: #192b33;
      font-size: 13px;
      line-height: 1.5;
    }

    .real-season-panel strong {
      display: block;
      margin-bottom: 4px;
      color: #edbc77;
    }

    .real-season-panel small {
      display: block;
      margin-top: 5px;
      color: #aebfc5;
    }
  `;
  document.head.appendChild(style);

  function timeLeft(ms) {
    const hours = Math.max(1, Math.ceil(ms / 3600000));
    const days = Math.floor(hours / 24);
    const rest = hours % 24;

    return days
      ? `${days} дн.${rest ? ` ${rest} ч.` : ""}`
      : `${hours} ч.`;
  }

  function updateImages(season) {
    document.querySelectorAll("#app .art").forEach(container => {
      const caption = container.querySelector(".art-caption");

      if (caption) {
        const text =
          `${season.name} · смена сезона через ${timeLeft(season.remaining)}`;

        if (caption.textContent !== text) {
          caption.textContent = text;
        }
      }

      let image = container.querySelector(".real-season-image");

      if (image && image.dataset.file === season.file) return;

      if (image) image.remove();

      const fallback = container.querySelector("svg");
      if (fallback) fallback.removeAttribute("hidden");

      image = document.createElement("img");
      image.className = "real-season-image";
      image.dataset.file = season.file;
      image.alt = season.index === 3
        ? "Зимний город"
        : "Панорама города";
      image.decoding = "async";
      image.hidden = true;

      image.addEventListener("load", () => {
        if (!image.isConnected) return;

        image.hidden = false;
        if (fallback) fallback.setAttribute("hidden", "");
      }, { once: true });

      image.addEventListener("error", () => {
        if (!image.isConnected) return;

        image.hidden = true;
        if (fallback) fallback.removeAttribute("hidden");
      }, { once: true });

      container.appendChild(image);
      image.src = BASE + encodeURIComponent(season.file);
    });
  }

  function updatePanel(season) {
    const header = document.querySelector("#app > header");
    if (!header) return;

    let panel = header.querySelector(".real-season-panel");

    if (!panel) {
      panel = document.createElement("section");
      panel.className = "real-season-panel";
      panel.setAttribute("aria-label", "Сезон и расходы котельной");
      header.appendChild(panel);
    }

    const boiler = state.jobs && state.jobs.heat;
    const cost = boilerExpense(season);

    let heatingText;

    if (!boiler) {
      heatingText = "Котельная ещё не восстановлена.";
    } else if (!(state.population > 1)) {
      heatingText = "Котельная готова. Расходы начнутся после заселения.";
    } else {
      heatingText =
        `Котельная: $${cost.toLocaleString("ru-RU")} за игровой день.`;
    }

    const loadText = season.saving
      ? `Расходы на отопление ниже зимних на ${season.saving}%.`
      : "Котельная работает с полной зимней нагрузкой.";

    const html = `
      <strong>${season.name} · следующий сезон: ${season.nextName}</strong>
      <div>Смена через ${timeLeft(season.remaining)} реального времени.</div>
      <div>${heatingText}</div>
      <small>${loadText}</small>
      <small>Сезон длится 7 реальных суток. Списание — только за игровые дни.</small>
    `;

    if (panel.innerHTML !== html) panel.innerHTML = html;
  }

  function updateHeatingDescriptions() {
    document.querySelectorAll("#app [data-action='build'][data-id='heat']")
      .forEach(button => {
        const description = button.querySelector("small");
        if (!description) return;

        description.textContent = button.dataset.option === "0"
          ? "3 дн. · Капитальная котельная. Содержание после заселения: $90 летом, $150 весной и осенью, $300 зимой за игровой день."
          : "1 дн. · Временный контур. Содержание после заселения: $135 летом, $225 весной и осенью, $450 зимой за игровой день. Для расширения нужна модернизация.";
      });
  }

  function updateSeasonUI() {
    const season = seasonInfo();
    updateImages(season);
    updatePanel(season);
    updateHeatingDescriptions();
    return season.index;
  }

  let displayedSeason = null;

  render = function renderWithSeasons() {
    ensureStart();
    const result = originalRender.apply(this, arguments);
    displayedSeason = updateSeasonUI();
    return result;
  };

  function refreshClock() {
    if (document.hidden) return;

    const season = seasonInfo();

    // Полная перерисовка нужна только при смене сезона:
    // так обновляется и сумма содержания города.
    if (displayedSeason !== season.index) {
      render();
    } else {
      updateSeasonUI();
    }
  }

  document.addEventListener("visibilitychange", refreshClock);
  window.addEventListener("focus", refreshClock);
  window.setInterval(refreshClock, 60000);

  render();
})();
</script>
