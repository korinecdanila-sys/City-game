/* Окно диалога: разговор поверх игры, как в классических RPG */
.dialogue-overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;background:radial-gradient(circle at 50% 30%,#0b1a1fee,#04090bf7)}
.dialogue-panel{width:min(820px,100%);margin:auto auto 0;display:flex;gap:16px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(#16262bfa,#0d171bfa);border-top:1px solid #58707a;border-radius:20px 20px 0 0;box-shadow:0 -20px 60px #000a;max-height:88dvh;overflow:auto}
.dialogue-side{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dialogue-side .portrait{float:none;width:92px;height:120px;margin:0;border:1px solid #4a6068}
.dialogue-name{font-size:11px;color:var(--gold);text-align:center;line-height:1.3}
.dialogue-main{flex:1;min-width:0}
.dialogue-text p{font:15px/1.55 Georgia,serif;color:#dde5da;margin:0 0 11px}
.dialogue-choices{display:grid;gap:8px;margin-top:14px}
.dialogue-choice{text-align:left;background:#1e3038;border:1px solid #3d565f;padding:12px 14px;font-size:14px;color:#e9eee9;border-radius:10px}
.dialogue-choice:hover{border-color:var(--gold);background:#24383f}
@media(max-width:380px){.dialogue-panel{flex-direction:column;gap:10px}.dialogue-side{flex-direction:row;justify-content:flex-start}.dialogue-side .portrait{width:64px;height:84px}}

/* Рекламная карточка: заметная, но не кричащая */
.ad-card{border-color:#4b6470;background:linear-gradient(135deg,#1b2b33,#16242b)}
.ad-card .kicker{color:#8fb8c9}
.ad-card small{display:block;margin-top:8px;color:#93a7b0}

/* Плавные переходы между экранами и ответами */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeSoft{from{opacity:0}to{opacity:1}}
@keyframes pulseSoft{0%{opacity:.55}100%{opacity:1}}
main{animation:fadeUp .22s ease-out}
nav button{transition:color .18s,background .18s,transform .12s}
nav button:active{transform:scale(.94)}
button{transition:transform .12s ease,filter .16s ease,background .18s ease,border-color .18s ease}
button:active:not(:disabled){transform:scale(.975)}
.card{animation:fadeSoft .25s ease-out}
.dialogue-panel{animation:fadeUp .22s ease-out}
.dialogue-text p{animation:fadeSoft .28s ease-out}
.dialogue-choice{animation:fadeUp .2s ease-out;animation-fill-mode:both}
.dialogue-choice:nth-child(2){animation-delay:.05s}
.dialogue-choice:nth-child(3){animation-delay:.1s}
.dialogue-choice:nth-child(4){animation-delay:.15s}
.fade-out{opacity:0;transition:opacity .16s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Аккуратная кнопка «начать заново» */
.restart{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid #3c5158;background:#1b2a30;color:#9fb4bb;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;margin-right:8px}
.restart:hover{border-color:#8a6b45;color:var(--gold);background:#22353c}
.restart:active{transform:scale(.92)}

.bell{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid #3c5158;background:#1b2a30;color:#c9d8de;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;position:relative}
.bell:hover{border-color:#8a6b45;background:#22353c}

/* Лента новостей */
.news-list{display:grid;gap:10px}
.news-item{padding:10px 0;border-bottom:1px solid #2c3f46}
.news-item:last-child{border-bottom:0}
.news-item p{font:14px/1.45 system-ui,sans-serif;color:#dde5da;margin:4px 0 0}
.news-day{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#c9a06a}

    for (const p of Object.values(s.characters)) if (p.dueDay !== null && s.day >= p.dueDay) {
      if (p.health === 'injured') { p.health = 'critical'; p.dueDay = s.day + 3; effects.push(`${p.name}: критическое состояние.`); }
      else { p.health = 'dead'; p.dueDay = null; effects.push(`${p.name}: погиб без помощи.`); relations(s, -10); }
    }
    generateApplicants(s, effects);
    // Нехватка людей: кто-то болеет — на работах не хватает рук.
    for (const p of Object.values(s.characters)) {
      if (p.met && (p.health === 'injured' || p.health === 'critical')) {
        news(s, `${p.name} не может работать: нужна замена или помощь.`);
        break;
      }
    }
    // Если есть готовое пустое жильё и ждут заявки — люди начинают заселяться.
    if (s.settlement.applicants.length && s.day % 2 === 0) {
      for (const a of [...s.settlement.applicants]) {
        if (s.status !== 'playing') break;
        const slot = findFreeEntrance(s);
        if (!slot) break;
        const res = acceptApplicantInternal(s, a.id, effects);
        if (!res) break;
      }
    }
    departures(s, effects);
    if (s.day === 7) addEvent(s, 'threat', 'threat', 'Угроза мародёрства', effects);
    if (s.day === 30) addEvent(s, 'election', 'election', 'Выборы городского совета', effects);
    if (s.day >= 365) { s.status = 'lost'; effects.push('Год завершён: город не восстановлен.'); }
  }
}
/** Кто приходит сам: заявки появляются постепенно, от решений игрока, а не по кнопке. */
/** Детерминированный генератор: одинаковый город = одинаковые заявки. */
function rng(s) {
  s.seed = (Math.imul(s.seed || 123456789, 1103515245) + 12345) >>> 0;
  return (s.seed % 100000) / 100000;
}

function generateApplicants(s, effects) {
  if (s.status !== 'playing') return;
  if (freeCapacity(s) <= 0) return;
  const trust = Object.values(s.characters).filter(p => p.health !== 'dead').reduce((n, p) => n + p.relation, 0) / 3;
  const free = s.houses.reduce((n, h) => n + h.entrances.filter(e => e.stage === 3).reduce((m, e) => m + 130 - e.residents, 0), 0);
  if (free === 0) return;
  // Чем больше свободного жилья, тем больше желающих приходит за день.
  const incoming = Math.max(3, Math.min(14, Math.ceil(free / 120)));
  for (let i = 0; i < incoming; i++) {
    if (s.settlement.applicants.length >= 12) break;
    const chance = Math.min(0.97, 0.62 + free / 1500 + (trust - 50) / 500);
    if (rng(s) > chance) continue;
    pushApplicant(s, effects);
  }
}

function pushApplicant(s, effects) {
  const size = 1 + Math.floor(rng(s) * 4);
  const payer = s.population > 120 ? 'buy' : 'free';
  s.settlement.applicants.push({
    id: 'ap' + (s.settlement.nextApplicant = (s.settlement.nextApplicant || 1) + 1),
    size,
    workers: Math.max(1, size - 1),
    revenue: payer === 'buy' ? 1500 + size * 900 : 0,
    kind: payer,
    note: payer === 'buy' ? 'Готовы купить квартиру' : 'Приехали бы бесплатно, с работой помогут'
  });
  news(s, 'Появились желающие заселиться — посмотрите заявки.');
  effects.push('Появились желающие заселиться. Посмотрите, кто просится в город.');
}

/** Свободная мощность: сколько ещё человек можно принять. */
function freeCapacity(s) {
  if (SERVICES.some(k => s.infrastructure[k].damaged)) return 0;
  return Math.min(...SERVICES.map(k => s.infrastructure[k].capacity)) - s.population;
}

/** Сколько человек может приехать сейчас: запас мощности минус уже приехавшие. */
function flightSlots(s) {
  if (SERVICES.some(k => s.infrastructure[k].damaged)) return 0;
  const capacity = Math.min(...SERVICES.map(k => s.infrastructure[k].capacity));
  const pending = s.settlement.arriving.reduce((n, a) => n + (a.total - a.arrived), 0);
  return Math.max(0, capacity - s.population - pending);
}
/** Переселение идёт только действиями игрока: кто-то приезжает, кто-то устраивается. */
function advanceSettlement(s, effects) {
  for (const a of s.settlement.arriving) {
    if (a.arrived >= a.total) continue;
    // Переезд: не больше одной партии в сутки на приглашение, но без простоя,
    // если очередь желающих уже есть.
    if (a.lastDay !== undefined && a.lastDay >= s.day) continue;
    a.lastDay = s.day;
    const house = s.houses.find(h => h.id === a.houseId);
    const e = house && house.entrances[a.entrance];
    if (!e || e.stage !== 3 || e.residents >= 130) continue;
    const free = 130 - e.residents;
    const room = Math.min(free, a.total - a.arrived, Math.max(0, s.target - s.population));
    if (room <= 0) continue;
    // Партия — до 40 человек: перевозка, распаковка, прописка.
    const batch = Math.min(15, room);
    e.residents += batch; a.arrived += batch; s.population += batch;
    s.households.push(...makeHouseholds(house.id, a.entrance, batch)
      .map((f, i) => ({...f, id: `${house.id}-e${a.entrance}-f${s.households.filter(x => x.houseId === house.id && x.entrance === a.entrance).length + i + 1}`})));
    s.firstArrivalClaimed = true;
    if (a.first) {
      const grant = 20000;
      earn(s, grant); a.first = false;
      effects.push(`Первые ${batch} человек приехали и заселились. Муниципальная субсидия ${grant}.`);
    } else {
      earn(s, 12000); s.settlement.readmitted++;
      effects.push(`Заселились ещё ${batch} человек.`);
    }
  }
  s.settlement.arriving = s.settlement.arriving.filter(a => a.arrived < a.total);
  s.settlement.upToDate++;
  if (s.population > 0) {
    for (let n = 1; n <= Math.floor(s.population / 1040); n++) if (!s.claimedMilestones.includes(n)) {
      s.claimedMilestones.push(n); addEvent(s, `restoration-${n}`, 'restoration', `Восстановлен квартал ${n}`, effects);
    }
  }
  if (s.population === s.target && s.status === 'playing') { s.status = 'won'; effects.push('Победа: 10 000 жителей вернулись домой!'); }
}

/** Одна семья с уникальным идентификатором в конкретном подъезде. */
function makeFamily(s, houseId, entrance, size, workers) {
  // Одна заявка может быть родственной группой: делим на семьи до 5 человек.
  const out = [];
  let left = size;
  // Свободные номера семей в этом подъезде, без повторов.
  const used = new Set(s.households.filter(x => x.houseId === houseId && x.entrance === entrance)
    .map(x => Number(String(x.id).split('-f')[1])).filter(Number.isFinite));
  let counter = used.size ? Math.max(...used) : 0;
  while (left > 0) {
    const part = Math.min(5, left);
    left -= part;
    counter += 1;
    const n = counter;
    const w = Math.min(Math.max(1, Math.min(workers || 1, 2)), Math.max(1, part - 1));
    out.push({id: `${houseId}-e${entrance}-f${n}`, houseId, entrance, size: part, workers: w, children: part - w});
  }
  return out;
}

function acceptApplicantInternal(s, applicantId, effects) {
  const a = s.settlement.applicants.find(x => x.id === applicantId);
  requireRule(a, 'INVALID_ACTION', 'Заявка не найдена.');
  if (freeCapacity(s) < a.size) return false;
  const target = findFreeEntrance(s);
  if (!target) return false;
  s.settlement.applicants = s.settlement.applicants.filter(x => x.id !== a.id);
  const e = s.houses.find(h => h.id === target.houseId).entrances[target.entrance];
  const room = Math.min(a.size, 130 - e.residents, s.target - s.population);
  if (room <= 0) return false;
  e.residents += room; s.population += room;
  s.households.push(...makeFamily(s, target.houseId, target.entrance, room, a.workers));
  s.firstArrivalClaimed = true;
  if (a.kind === 'buy') earn(s, a.revenue);
  for (let n = 1; n <= Math.floor(s.population / 1040); n++) if (!s.claimedMilestones.includes(n)) {
    s.claimedMilestones.push(n); addEvent(s, `restoration-${n}`, 'restoration', `Восстановлен квартал ${n}`, effects);
  }
  if (s.population === s.target && s.status === 'playing') { s.status = 'won'; effects.push('Победа: 10 000 жителей вернулись домой!'); }
  effects.push(a.kind === 'buy'
    ? `Семья из ${room} человек купила квартиру: +${a.revenue}.`
    : `Семья из ${room} человек заселилась.`);
  return true;
}

function findFreeEntrance(s) {
  for (const h of s.houses) {
    for (let i = 0; i < h.entrances.length; i++) {
      const e = h.entrances[i];
      if (e.stage === 3 && e.residents < 130) return {houseId: h.id, entrance: i};
    }
  }
  return null;
}

/** Дыхание дня: часть действий затрачивает «время» и приближает смену суток. */
const DAY_COST = {
  repair: 1, infrastructure: 1, buildHouse: 1, acceptApplicant: 1,
  dialogue: 1, help: 0, declineApplicant: 1, quest: 1
};

function spendAction(s, type, effects) {
  if (!DAY_COST[type]) return;
  s.dayState.actionsLeft -= DAY_COST[type];
  if (s.dayState.actionsLeft > 0) return;
  // День кончился: идёт ночь, приходят люди, уходят люди, начисляются деньги.
  tick(s, 1, s.lastNow, effects);
  s.dayState.actionsLeft = 2;
  s.dayState.questsDone = s.dayState.questsDone.filter(q => q.day === s.day);
  s.dayState.adSkipUsed = false;
  effects.push('Наступил новый день.');
}

const FIELDS = {
  buildHouse: ['type'], infrastructure: ['type', 'service'], repair: ['type', 'houseId', 'entrance', 'step'],
  settle: ['type', 'houseId', 'entrance'], wait: ['type', 'days', 'viaAd', 'rewardIds'], help: ['type', 'characterId', 'choice'], event: ['type', 'eventId', 'choice'],
  repairService: ['type', 'service'], dialogue: ['type', 'characterId', 'choice'],
  acceptApplicant: ['type', 'applicantId'], declineApplicant: ['type', 'applicantId'], quest: ['type'], meetBatch: ['type'],
};
function act(state, action, now = Date.now()) {
  try {
    const valid = validateSave(state);
    requireRule(valid.ok, valid.error?.code, valid.error?.message);
    timestamp(now); requireRule(now >= state.lastNow, 'INVALID_TIME', 'Время не может идти назад.');
    requireRule(state.status === 'playing', 'GAME_OVER', 'Игра уже завершена.');
    const fields = obj(action) && Object.hasOwn(FIELDS, action.type) && FIELDS[action.type];
    requireRule(fields && Object.keys(action).length === fields.length && fields.every(k => Object.hasOwn(action, k)), 'INVALID_ACTION', 'Неизвестное действие или неверные поля.');
    const s = clone(state), effects = [];
    s.lastNow = now;
    if (action.type === 'buildHouse') {
      requireRule(s.houses.length < 80, 'LIMIT', 'Достигнут предел домов.');
      spend(s, 12000); s.houses.push({id: `h${s.nextHouseId++}`, entrances: Array.from({length: 4}, entrance)});
      effects.push('Заложен новый дом: четыре подъезда по 130 жителей.');
    } else if (action.type === 'infrastructure') {
      requireRule(SERVICES.includes(action.service), 'INVALID_ACTION', 'Неизвестная инфраструктура.');
      const v = s.infrastructure[action.service];
      requireRule(v.level < 10, 'LIMIT', 'Мощность уже максимальна.');
      spend(s, 20000); v.level++; v.capacity += 1040; v.staff += 3;
      effects.push(`${action.service}: мощность +1040, персонал +3.`);
    } else if (action.type === 'repair' || action.type === 'settle') {
      const house = s.houses.find(h => h.id === action.houseId);
      requireRule(house && integer(action.entrance, 0, 3), 'INVALID_ACTION', 'Дом или подъезд не найден.');
      const e = house.entrances[action.entrance];
      if (action.type === 'repair') {
        const stage = ['clear', 'repair', 'connect'].indexOf(action.step);
        requireRule(stage >= 0 && e.stage === stage, 'INVALID_STAGE', 'Нарушен порядок ремонта или этап уже завершён.');
        spend(s, [1500, 8000, 1500][stage]); e.stage++; effects.push('Этап ремонта завершён.');
      } else {
        // settle = приглашение. Люди не появляются мгновенно: они переезжают
        // и заселяются по мере действий игрока.
        requireRule(e.stage === 3, 'INVALID_STAGE', 'Сначала подготовьте подъезд.');
        // Уже заселено — считаем приглашение исполненным, без ошибки.
        if (e.residents > 0) { effects.push('В этом подъезде уже живут люди, приглашение не требуется.'); }
        requireRule(!s.settlement.arriving.some(a => a.houseId === house.id && a.entrance === action.entrance), 'ALREADY_RESOLVED', 'В этот подъезд уже приглашены люди.');
        const isFirst = !s.firstArrivalClaimed;
      if (isFirst) s.settlement.invited = (s.settlement.invited || 0);
        const batch = isFirst ? 130 : 60;
        const slots = flightSlots(s);
        requireRule(slots >= batch, 'CAPACITY', `Нужна свободная мощность инфраструктуры хотя бы на ${batch} человек.`);
        s.settlement.arriving.push({houseId: house.id, entrance: action.entrance, total: batch, arrived: 0, first: isFirst, day: s.day});
        news(s, `Приглашены жители: ${batch} человек прибудут партиями.`);
        effects.push(isFirst
          ? 'Приглашение передано. Первые 130 человек поедут к вам, начнут устраиваться и заселятся постепенно.'
          : 'Приглашение отправлено: по мере дел и жилья люди приезжают партиями.');
      }
    } else if (action.type === 'repairService') {
      requireRule(SERVICES.includes(action.service), 'INVALID_ACTION', 'Неизвестная инфраструктура.');
      const v = s.infrastructure[action.service];
      requireRule(v.damaged, 'INVALID_STAGE', 'Служба не повреждена.');
      spend(s, 3000); v.damaged = false;
      s.disruption = SERVICES.some(k => s.infrastructure[k].damaged);
      effects.push('Авария устранена, заселение снова доступно.');
    } else if (action.type === 'declineApplicant') {
      const a = s.settlement.applicants.find(x => x.id === action.applicantId);
      requireRule(a, 'INVALID_ACTION', 'Заявка не найдена.');
      s.settlement.applicants = s.settlement.applicants.filter(x => x.id !== a.id);
      relations(s, -1);
      news(s, 'Вы отказали семье в заселении.');
      effects.push('Вы отказали семье. Слух о городе стал хуже.');
    } else if (action.type === 'dialogue') {
      requireRule(PEOPLE.includes(action.characterId) && ['listen', 'dismiss'].includes(action.choice), 'INVALID_ACTION', 'Неверный диалог.');
      const p = s.characters[action.characterId];
      requireRule(p.health !== 'dead', 'INVALID_HEALTH', 'Персонаж погиб.');
      requireRule(!p.dialogueDone, 'ALREADY_RESOLVED', 'Этот разговор уже завершён.');
      p.dialogueDone = true;
      p.relation = Math.max(0, Math.min(100, p.relation + (action.choice === 'listen' ? 5 : -10)));
      tick(s, 1, now, effects);
      effects.push(action.choice === 'listen' ? 'Вы выслушали персонажа: отношения улучшились.' : 'Резкий отказ ухудшил отношения.');
    } else if (action.type === 'meetBatch') {
      // Первая партия: 130 человек и пятеро ключевых с именами.
      requireRule(!s.settlement.firstBatchArrived, 'ALREADY_RESOLVED', 'Первая партия уже приехала.');
      const readySeats = s.houses.reduce((n, h) => n + h.entrances.filter(e => e.stage === 3).reduce((m, e) => m + (130 - e.residents), 0), 0);
      requireRule(readySeats >= 40, 'CAPACITY', 'Сначала подготовьте хотя бы один подъезд: людям нужны готовые комнаты и работающая вода, свет и тепло.');
      requireRule(freeCapacity(s) >= 130, 'CAPACITY', 'Не хватает мощности инфраструктуры на 130 человек. Увеличьте системы города.');
      s.settlement.firstBatchArrived = true;
      for (const id of ['engineer', 'doctor', 'organizer']) if (s.characters[id]) s.characters[id].met = true;
      s.population += 0; // люди приезжают партиями через заселение
      s.settlement.arriving.push({houseId: null, entrance: null, total: 130, arrived: 0, first: true, day: s.day, batch: 'first'});
      news(s, 'Приехала первая партия из общежития: 130 человек.');
      effects.push('Приехали 130 человек из общежития. Среди них — электрик, врач и старшая по дому.');
    } else if (action.type === 'quest') {
      effects.push('Задание решено. Ушло одно действие дня.');
    } else if (action.type === 'acceptApplicant') {
      acceptApplicantInternal(s, action.applicantId, effects);
    } else if (action.type === 'wait') {
      if (action.viaAd === true) {
        requireRule(Array.isArray(action.rewardIds) && action.rewardIds.length > 0, 'AD_UNVERIFIED', 'Пропуск дня награждается только после подтверждения рекламы.');
        requireRule(!s.dayState.adSkipUsed, 'ALREADY_RESOLVED', 'Сегодня уже пропускали день за рекламу.');
        s.dayState.adSkipUsed = true;
        tick(s, 1, now, effects);
        if (s.status === 'playing') advanceSettlement(s, effects);
        s.dayState.adSkipUsed = false; // новый день — новый пропуск
        s.dayState.actionsLeft = 2;
        effects.push('День прожит за рекламу. Действия не тратились.');
      } else {
        requireRule(integer(action.days, 1, 30), 'INVALID_ACTION', 'Ожидание: от 1 до 30 игровых суток.');
        effects.push('Простой день не даёт бесплатного прогресса; используйте действия или рекламу.');
        tick(s, 0, now, effects);
      }
    } else if (action.type === 'help') {
      requireRule(PEOPLE.includes(action.characterId) && ['free', 'medical', 'refuse'].includes(action.choice), 'INVALID_ACTION', 'Неверный выбор помощи.');
      const p = s.characters[action.characterId];
      requireRule(['injured', 'critical'].includes(p.health), 'INVALID_HEALTH', 'Помощь доступна только раненым и критическим персонажам.');
      if (action.choice === 'refuse') {
        requireRule(!p.refused, 'ALREADY_RESOLVED', 'Отказ уже учтён.');
        p.refused = true; p.relation = Math.max(0, p.relation - 20); p.dueDay = Math.min(p.dueDay, s.day + 1);
        effects.push('Отказ ухудшил отношения и ускорил ухудшение здоровья.');
      } else {
        if (action.choice === 'medical') spend(s, 2000);
        p.health = 'healthy'; p.dueDay = null; p.refused = false; p.relation = Math.min(100, p.relation + 10);
        if (action.choice === 'free') tick(s, 1, now, effects);
        effects.push('Персонаж спасён.');
      }
    } else if (action.type === 'event') {
      const e = s.events.find(e => e.id === action.eventId);
      requireRule(e && !e.resolved, 'ALREADY_RESOLVED', 'Событие отсутствует или уже завершено.');
      requireRule(eventChoices[e.kind].includes(action.choice), 'INVALID_ACTION', 'Неверный выбор события.');
      e.resolved = true; e.choice = action.choice;
      if (e.kind === 'threat') {
        if (action.choice === 'pay') spend(s, 5000);
        else if (action.choice === 'secure') tick(s, 1, now, effects);
        else { s.disruption = true; s.infrastructure.power.damaged = true; relations(s, -10);
          const p = s.characters.engineer;
          if (p.health === 'healthy') { p.health = 'injured'; p.dueDay = s.day + 3; p.refused = false; }
          effects.push('Авария электросети: новое заселение остановлено до ремонта. Инженер ранен; через 3 суток состояние станет критическим без помощи. Бесплатная помощь доступна.'); }
      } else if (e.kind === 'election') {
        earn(s, action.choice === 'community' ? 25000 : 40000); relations(s, action.choice === 'community' ? 5 : -15);
      } else earn(s, 20000);
      effects.push(`Событие завершено: ${e.title}.`);
    }
    // Люди устраиваются не сразу: переезд идёт после действий и в дни ожидания.
    if (['repair', 'infrastructure', 'buildHouse', 'acceptApplicant'].includes(action.type) && s.status === 'playing') {
      advanceSettlement(s, effects);
      generateApplicants(s, effects);
    }
    if (s.status === 'playing' && !['wait', 'adReward'].includes(action.type)) spendAction(s, action.type, effects);
    const check = validateSave(s);
    requireRule(check.ok, 'INTERNAL_ERROR', check.error?.message);
    return {ok: true, state: s, effects, error: null};
  } catch (e) {
    return {ok: false, state, effects: [], error: {code: e.code || 'INVALID_ACTION', message: e.message}};
  }
}

// Самостоятельные сюжетные данные. Не содержат UI, таймеров или игрового движка.
// STORY и EVENTS — массивы. next: id следующей сцены/события либо null (выход из цепочки).
// effects: числовые значения — изменения ресурсов; flags — устанавливаемые сюжетные флаги.
// requires, unlocks, deadline и consequences — декларативные условия и последствия для интеграции.

// Независимые диалоги: модуль не изменяет engine, DOM или переданную сессию.
// Сохраняйте новую session атомарно. effects.id — ключ дедупликации для интеграции:
// чистая функция не может запретить вызывающей стороне повторно подать старый snapshot.
// Одно дерево выдаёт один пакет эффектов. Повторные старты того же дерева не должны
// повторно награждаться интеграцией: id эффекта стабилен для conversationId.
const paragraphs = (...lines) => lines.join('\n\n');
const emptyEffects = () => ({ relation: {}, flags: [] });
const freeze = value => {
  if (value && typeof value === 'object') {
    Object.values(value).forEach(freeze);
    Object.freeze(value);
  }
  return value;
};

function tree(id, characterId, title, p) {
  return { id, characterId, title, start: 'opening', nodes: {
    opening: {
      text: paragraphs(...p.opening),
      choices: [
        { id: 'ask', label: p.ask, next: 'personal', flags: ['heard_personal'] },
        { id: 'practical', label: p.practicalLabel, next: 'practical_end' },
        { id: 'together', label: p.togetherLabel, next: 'together_end', requires: ['heard_personal'] },
        { id: 'refuse', label: p.refuseLabel, next: 'refusal' },
      ],
    },
    personal: {
      text: paragraphs(...p.personal),
      choices: [
        { id: 'together', label: p.togetherLabel, next: 'together_end', requires: ['heard_personal'] },
        { id: 'practical', label: p.practicalLabel, next: 'practical_end' },
        { id: 'back', label: 'Давай вернёмся к тому, с чего начали', next: 'opening' },
        { id: 'refuse', label: p.refuseLabel, next: 'refusal' },
      ],
    },
    practical_end: {
      text: paragraphs(...p.practical), terminal: true,
      outcome: { relation: { [characterId]: 1 }, flags: [`${id}:practical`] },
    },
    together_end: {
      text: paragraphs(...p.together), terminal: true,
      outcome: { relation: { [characterId]: 2 }, flags: [`${id}:together`] },
    },
    refusal: {
      text: paragraphs(...p.refusal), terminal: true,
      outcome: { relation: { [characterId]: 0 }, flags: [`${id}:declined`] },
    },
  } };
}

const byId = new Map(CONVERSATIONS.map(item => [item.id, item]));
function view(def, nodeId, flags, finished = false, effectsApplied = false) {
  const node = def.nodes[nodeId];
  return {
    conversationId: def.id, characterId: def.characterId, nodeId,
    title: def.title, text: node.text, flags: [...flags], finished, effectsApplied,
    choices: finished ? [] : (node.choices || [])
      .filter(c => (c.requires || []).every(flag => flags.includes(flag)))
      .map(c => ({ id: c.id, label: c.label })),
  };
}

function startConversation(id) {
  const def = byId.get(id);
  return def ? view(def, def.start, []) : null;
}

function chooseReply(session, choiceId) {
  const fail = error => ({ ok: false, session, reply: '', effects: emptyEffects(), error });
  if (!session || typeof session !== 'object') return fail('invalid_session');
  const def = byId.get(session.conversationId);
  if (!def || !Object.hasOwn(def.nodes, session.nodeId) || !Array.isArray(session.flags) || session.flags.some(f => typeof f !== 'string')) return fail('invalid_session');
  if (session.finished || session.effectsApplied || def.nodes[session.nodeId].terminal) return fail('conversation_finished');
  const node = def.nodes[session.nodeId];
  const choice = (node.choices || []).find(c => c.id === choiceId);
  if (!choice) return fail('invalid_choice');
  if (!(choice.requires || []).every(flag => session.flags.includes(flag))) return fail('choice_locked');
  const flags = [...new Set([...session.flags, ...(choice.flags || [])])];
  const destination = def.nodes[choice.next];
  if (!destination) return fail('invalid_destination');
  const finished = destination.terminal === true;
  const effects = finished ? {
    id: `conversation:${def.id}:complete`,
    relation: { ...destination.outcome.relation },
    flags: [...destination.outcome.flags],
  } : emptyEffects();
  const next = view(def, choice.next, [...new Set([...flags, ...effects.flags])], finished, finished);
  return { ok: true, session: next, reply: destination.text, effects };
}

//
// Награда выдаётся ТОЛЬКО в .then() от сети, а не из нашей кнопки.

const AD_CONFIG = {

  },
  perDayLimit: 3
};

const used = { day: null, total: 0, types: new Set() };
function resetIfNewDay(day) {
  if (used.day !== day) { used.day = day; used.total = 0; used.types.clear(); }
}

let sdkPromise = null;
function loadSdk() {
  if (sdkPromise) return sdkPromise;
  sdkPromise = new Promise((resolve, reject) => {
    if (window.Adsgram) return resolve(window.Adsgram);
    const script = document.createElement('script');
    script.src = AD_CONFIG.sdkUrl;
    script.async = true;
    script.onload = () => window.Adsgram ? resolve(window.Adsgram) : reject(new Error('SDK не инициализировался'));
    script.onerror = () => reject(new Error('SDK не загрузился'));
    document.head.appendChild(script);
  });
  return sdkPromise;
}

/** Проверка: можно ли показать награду сейчас. */
function canWatch(reward, day) {
  resetIfNewDay(day);
  if (!AD_CONFIG.rewards[reward]) return { ok: false, reason: 'Неизвестная награда.' };
  if (used.total >= AD_CONFIG.perDayLimit) return { ok: false, reason: 'На сегодня лимит рекламных наград исчерпан.' };
  if (used.types.has(reward)) return { ok: false, reason: 'За эту награду сегодня уже смотрели.' };
  return { ok: true };
}

async function watchAd(reward, day) {
  const check = canWatch(reward, day);
  if (!check.ok) return check;
  try {
    const Adsgram = await loadSdk();
    const controller = Adsgram.init({ blockId: AD_CONFIG.blockId });
    // .then() — сеть подтвердила просмотр. Именно здесь появляется право на награду.
    await controller.show();
    used.total += 1;
    used.types.add(reward);
    return { ok: true, rewardIds: ['adsgram:' + reward + ':' + Date.now()] };
  } catch (error) {
    const detail = error?.description || error?.message || error?.reason || '';
    return {
      ok: false,
      reason: 'Реклама не досмотрена. Награда не выдана.' + (detail ? ' (' + detail + ')' : '')
    };
  }
}

function adStatus(day) {
  resetIfNewDay(day);
  return { enabled: AD_CONFIG.enabled, usedToday: used.total, limit: AD_CONFIG.perDayLimit, blockId: AD_CONFIG.blockId };
}

/** Случайные люди в партии: без имён, 1–10 человек. */
function randomBatch(rng, count) {
  const n = 1 + Math.floor(rng() * Math.min(10, count));
  return { people: n, families: Math.max(1, Math.ceil(n / 4)) };
}

function isMet(state, id) {
  return Boolean(state.characters?.[id] && state.characters[id].met);
}

function metList(state) {
  return Object.entries(state.characters || {})
    .filter(([, c]) => c.met && c.health !== 'dead')
    .map(([id, c]) => ({ id, ...c }));
}

/** Условие вида 'population>=260'. */
function conditionMet(state, expr) {
  const m = /^population>=(\d+)$/.exec(expr || '');
  return m ? Number(state.population) >= Number(m[1]) : false;
}

function readSave(storage,validate,migrate=null){
 try{
  const raw=storage.getItem(STORAGE_KEY);
  if(raw===null)return {data:null,error:null};
  const data=JSON.parse(raw);
  if(data?.game&&migrate){const result=migrate(data.game);if(result.ok)data.game=result.state;}
  if(!data||data.version!==1||!data.game||!validate(data.game).ok)return {data:null,error:'Сохранение несовместимо или повреждено. Оно не удалено.'};
  return {data,error:null};
 }catch(e){return {data:null,error:'Сохранение недоступно или повреждено. Оно не удалено.'};}
}

   }
   watchAd('skipDay', model.game.day).then(res=>{
     if(!res.ok){toast(res.reason);return;}
     doAction({type:'wait',days:1,viaAd:true,rewardIds:['skipDay:'+Date.now()]});
   });
   return;
 }
 if(d.action==='noop')return;
 if(d.action==='conversation'){const c=startConversation(d.id);if(!c||model.completedConversations.includes('conversation:'+d.id+':complete')||model.game.characters[c.characterId]?.health==='dead')return;model.conversation=c;save();render();dialogueModal();return;}
 if(d.action==='closeConversation'){model.conversation=null;const b=document.getElementById('dialogueBox');if(b)b.style.display='none';save();render();return;}
 if(d.action==='reply'){if(!model.conversation)return;const r=chooseReply(model.conversation,d.id);if(!r.ok){toast('Этот ответ недоступен.');return;}model.conversation=r.session;const fx=r.effects;if(fx.id&&!model.completedConversations.includes(fx.id)){for(const [id,delta]of Object.entries(fx.relation)){const p=model.game.characters[id];if(p)p.relation=Math.max(0,Math.min(100,p.relation+delta));else model.personalRelations[id]=Math.max(0,Math.min(100,(model.personalRelations[id]??50)+delta));}model.completedConversations.push(fx.id);model.dialogueFlags=[...new Set([...model.dialogueFlags,...fx.flags])];model.history.unshift({day:model.game.day,text:'Завершён разговор: '+r.session.title});}save();render();dialogueModal();return;}
 if(d.action==='story'){
  if(model.started||model.dialogueFlags?.includes('bet_declined'))return;
  const scene=STORY[model.scene],choice=scene?.choices?.[Number(d.option)];if(!choice)return;
  const flags=[...new Set([...(Array.isArray(model.dialogueFlags)?model.dialogueFlags:[]),...(choice.effects?.flags||[])])];
  const next=choice.next===null?-1:STORY.findIndex(s=>s.id===choice.next);
  if((choice.next!==null&&next<0)||(choice.next===null&&!flags.includes('bet_declined')&&!flags.includes('prologue_complete'))){toast('У этой ветки пока нет продолжения. Прогресс не изменён.');return;}
  if(scene.id==='night_talk'){
   const name=document.getElementById('storyNameInput')?.value.trim();
   if(!name){toast('Введите название города перед утренним осмотром.');return;}
   model.name=name.slice(0,30);
  }
  model.dialogueFlags=flags;
  // Начальный капитал уже задан newGame(). Пролог применяет только сюжетные flags.
  model.history.unshift({day:0,text:scene.title+': '+choice.label});
  model.history=model.history.slice(0,100);
  if(choice.next===null)model.started=flags.includes('prologue_complete')&&!flags.includes('bet_declined');
  else model.scene=next;
  save();render();window.scrollTo(0,0);return;
 }
 if(d.action==='rename'){model.name=document.getElementById('nameInput').value.trim()||model.name;save();render();return}
 if(d.action==='newsMenu'){
   const news=(model.game.news||[]);
   model.newsRead=news.length;save();
   const box=document.getElementById('dialogueBox')||(()=>{const b=document.createElement('div');b.id='dialogueBox';b.className='dialogue-overlay';document.body.appendChild(b);return b;})();
   box.innerHTML=`<div class="dialogue-panel"><div class="dialogue-main">
    <div class="kicker">Городские новости</div>
    <div class="dialogue-text news-list">${news.length?news.slice(0,40).map(n=>`<div class="news-item"><span class="news-day">День ${n.day}</span><p>${E(n.text)}</p></div>`).join(''):'<p>Пока новостей нет.</p>'}</div>
    <div class="dialogue-choices">${button('Закрыть','closeNews','',true)}</div></div></div>`;
   box.style.display='flex';
   render(true);
   return;
 }
 if(d.action==='closeNews'){const b=document.getElementById('dialogueBox');if(b)b.style.display='none';save();render(true);return;}
 if(d.action==='resetMenu'){
   if(confirm('Начать заново?\n\nВесь прогресс города будет удалён. Это действие нельзя отменить.')){
     model={version:1,game:newGame(),name:'Новая Надежда',scene:0,started:false,history:[],dialogueFlags:[],completedConversations:[],personalRelations:{anatoly:50},questsDone:[],items:[],lastChoice:null};
     save();const box=document.getElementById('dialogueBox');if(box)box.style.display='none';
     render();window.scrollTo(0,0);
   }
   return;
 }
 if(d.action==='reset'){if(confirm('Удалить прогресс этой версии и начать заново?')){model={version:1,game:newGame(),name:'Новая Надежда',scene:0,started:false,history:[],dialogueFlags:[],completedConversations:[],personalRelations:{anatoly:50}};save();render()}return}
 const actions={repairService:()=>({type:'repairService',service:d.id}),dialogue:()=>({type:'dialogue',characterId:d.id,choice:d.choice}),repair:()=>({type:'repair',houseId:d.house,entrance:Number(d.entrance),step:d.step}),settle:()=>({type:'settle',houseId:d.house,entrance:Number(d.entrance)}),infrastructure:()=>({type:'infrastructure',service:d.id}),newHouse:()=>({type:'buildHouse'}),wait:()=>({type:'wait',days:Number(d.days)}),help:()=>({type:'help',characterId:d.id,choice:d.choice}),event:()=>({type:'event',eventId:d.id,choice:d.choice})};
 if(actions[d.action])doAction(actions[d.action]());
});
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').close();
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){e.target.hidden=true;}},true);
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch{}
render();
</script></body></html>
